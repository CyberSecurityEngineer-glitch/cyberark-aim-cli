[project]
name = "cyberark-aim-cli"
version = "0.1.0"
description = "Simulated client-side CyberArk AIM secret retrieval and rotation tool"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
aim = "cyberark_aim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
